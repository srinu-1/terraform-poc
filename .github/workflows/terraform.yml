name: Ticket Infra Automation

on:
  issues:
    types: [opened]

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set Variables
        run: |
          echo "TICKET_ID=ISSUE-${{ github.event.issue.number }}" >> $GITHUB_ENV
          echo "INSTANCE_TYPE=t2.micro" >> $GITHUB_ENV
          echo "INSTANCE_COUNT=2" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="instance_type=${{ env.INSTANCE_TYPE }}" \
            -var="instance_count=${{ env.INSTANCE_COUNT }}" \
            -var="ticket_id=${{ env.TICKET_ID }}"
